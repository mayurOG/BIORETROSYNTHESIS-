[client]
showErrorDetails = true

[server]
port = 8501
enableXsrfProtection = true
maxUploadSize = 200
enableCORS = true

[theme]
primaryColor = "#1f77b4"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
font = "sans serif"

[logger]
level = "info"
messageFormat = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

[client.toolbarMode]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
serverAddress = "localhost"
