name: License Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  license-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies and license scanner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-licenses

      - name: Audit dependency licenses
        run: |
          pip-licenses --format=markdown --with-urls
          pip-licenses --fail-on="GNU Affero General Public License v3 (AGPLv3)"
